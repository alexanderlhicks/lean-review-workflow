name: AI Code Review Action
description: 'Performs an AI code review based on comments'
inputs:
  github_token:
    description: 'GitHub Token for API calls'
    required: true
  gemini_api_key:
    description: 'Gemini API Key for AI review generation'
    required: true
  pr_number:
    description: 'The Pull Request number'
    required: true
  external_refs:
    description: 'External references for context'
    required: false
  repo_context_refs:
    description: 'Comma-separated paths to additional repository files or directories for context'
    required: false
  additional_comments:
    description: 'Additional comments for the review'
    required: false
  gemini_model:
    description: 'The Gemini model to use for AI review generation'
    required: false
    default: 'gemini-3.1-pro-preview'
  lint:
    description: 'Whether to run the linter'
    required: false
    default: 'false'
outputs:
  review_text:
    description: "The generated review text"
    value: ${{ steps.run_review.outputs.review_text }}
runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 0

    - name: Copy action requirements
      run: cp ${{ github.action_path }}/requirements.txt ./action-requirements.txt
      shell: bash

    - name: Set up Python
      uses: actions/setup-python@v6.2.0
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: ./action-requirements.txt

    - name: Set up Lean and Build
      uses: leanprover/lean-action@v1.4.0
      with:
        build: true
        test: false
        lint: ${{ inputs.lint }}


    - name: Install dependencies
      run: pip install -r ./action-requirements.txt
      shell: bash

    - name: Discover Related Files
      id: discover_files
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ inputs.pr_number }}
      run: python ${{ github.action_path }}/discover_files.py


    - name: Run AI Review Script
      shell: bash
      id: run_review
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        PR_NUMBER: ${{ inputs.pr_number }}
        EXTERNAL_REFS: ${{ inputs.external_refs }}
        REPO_CONTEXT_REFS_INPUT: ${{ inputs.repo_context_refs }}
        DISCOVERED_FILES: ${{ steps.discover_files.outputs.discovered_files }}
        ADDITIONAL_COMMENTS: ${{ inputs.additional_comments }}
        GEMINI_MODEL: ${{ inputs.gemini_model }}
      run: |
        # Construct REPO_CONTEXT_REFS safely to avoid leading comma
        if [ -n "$REPO_CONTEXT_REFS_INPUT" ] && [ -n "$DISCOVERED_FILES" ]; then
          REPO_CONTEXT_REFS="$REPO_CONTEXT_REFS_INPUT,$DISCOVERED_FILES"
        elif [ -n "$REPO_CONTEXT_REFS_INPUT" ]; then
          REPO_CONTEXT_REFS="$REPO_CONTEXT_REFS_INPUT"
        else
          REPO_CONTEXT_REFS="$DISCOVERED_FILES"
        fi

        # Run the script and capture its output to post as a comment later
        # We use a special "end of file" marker to handle multiline output
        EOF_MARKER=$(head /dev/urandom | tr -dc A-Za-z0-9 | head -c 16)
        echo "review_text<<$EOF_MARKER" >> $GITHUB_OUTPUT
        python ${{ github.action_path }}/review.py \
          --pr-number "$PR_NUMBER" \
          --external-refs "$EXTERNAL_REFS" \
          --repo-context-refs "$REPO_CONTEXT_REFS" \
          --additional-comments "$ADDITIONAL_COMMENTS" \
          --gemini-model "$GEMINI_MODEL" >> $GITHUB_OUTPUT
        echo "$EOF_MARKER" >> $GITHUB_OUTPUT

    - name: Post Review Comment
      uses: actions/github-script@v8
      env:
        REVIEW_TEXT: ${{ steps.run_review.outputs.review_text }}
      with:
        retries: 3
        script: |
          const header = '### 🤖 AI Review (with external context)\n\n';
          const body = header + process.env.REVIEW_TEXT;
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;

          const comments = await github.rest.issues.listComments({
            owner,
            repo,
            issue_number,
          });

          const botComment = comments.data.find(comment => 
            comment.user.type === 'Bot' && comment.body.includes('### 🤖 AI Review')
          );

          if (botComment) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: botComment.id,
              body
            });
          } else {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body
            });
          }

    - name: Clean up artifacts
      if: always()
      shell: bash
      run: |
        rm -f ./action-requirements.txt
